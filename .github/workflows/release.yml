# Makes a draft GitHub release when a version tag is pushed. Create the tag with `npm version <x.y.z>`.
name: Release

on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Check that the tag matches manifest.json
        run: |
          version=$(node -p "require('./manifest.json').version")
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "The tag $GITHUB_REF_NAME does not match version $version in manifest.json."
            exit 1
          fi
          node -e "const v = require('./versions.json'); if (!v[process.argv[1]]) { console.error('versions.json has no entry for ' + process.argv[1]); process.exit(1); }" "$version"

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run plugin:build

      - name: Attest the build provenance
        uses: actions/attest@v4
        with:
          subject-path: |
            plugin/dist/main.js
            plugin/dist/manifest.json
            plugin/dist/styles.css

      - name: Create a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --draft \
            --verify-tag \
            plugin/dist/main.js plugin/dist/manifest.json plugin/dist/styles.css
